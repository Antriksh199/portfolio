name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm64/v8
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portfolio:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKER_USERNAME }}/portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/${{secrets.SERVER_USERNAME}}

          chmod 600 ~/.ssh/${{secrets.SERVER_USERNAME}}

      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan -H "${{ secrets.SERVER }}" >> ~/.ssh/known_hosts

      - name: Deploy to Kubernetes
        run: |
          ssh \
            -i ~/.ssh/${{secrets.SERVER_USERNAME}}\
            ${{secrets.SERVER_USERNAME}}@${{ secrets.SERVER }} \
            "KUBECONFIG=/home/${{ secrets.SERVER_USERNAME }}/.kube/config \
            kubectl set image deployment/portfolio \
            portfolio=${{ secrets.DOCKER_USERNAME }}/portfolio:latest \
            -n portfolio"

      - name: Verify Deployment
        run: |
          ssh \
            -i ~/.ssh/${{secrets.SERVER_USERNAME}} \
            ${{secrets.SERVER_USERNAME}}@${{ secrets.SERVER }} \
            "KUBECONFIG=/home/${{ secrets.SERVER_USERNAME }}/.kube/config \
            kubectl rollout status deployment/portfolio -n portfolio --timeout=180s"
      